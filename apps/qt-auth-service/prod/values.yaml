# GENERADO por el pipeline de CD desde QuantumTechPE/qt-auth-service@41e43f79b747e991e8eafcdeedea634b1b0c8699 (prod). No editar a mano:
# la configuración se cambia en la carpeta deploy/ del repo del microservicio.
containerPort: 8080
probes:
  liveness:
    path: /q/health/live
    initialDelaySeconds: 15
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 5
ingress:
  enabled: true
  subdomain: qt
  path: /api/auth
metrics:
  enabled: true
  path: /q/metrics
configFiles:
  mountPath: /deployments/config
  files:
    application.properties: |
      # =============================================================================
      # PROD · sobrescribe src/main/resources/application.properties en el clúster prod.
      # Se monta como ConfigMap en /deployments/config/application.properties.
      # Solo propiedades de RUNTIME. Secretos: NUNCA aquí → deploy/vault/secrets.yaml
      # =============================================================================
      quarkus.log.level=INFO
      quarkus.log.category."com.qt".level=INFO

      # Ejemplos (descomenta y ajusta):
      # quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-prod:5432/qt
      # quarkus.datasource.jdbc.max-size=20
      # quarkus.rest-client.otro-servicio.url=http://otro-servicio.otro-servicio.svc
config:
  JAVA_MAX_MEM_RATIO: "75"
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1500m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilizationSeconds: 600
podDisruptionBudget:
  enabled: true
  minAvailable: 1
spreadAcrossNodes: true
secrets:
  enabled: true
image:
  repository: ghcr.io/quantumtechpe/qt-auth-service
  digest: sha256:7623725ef8df6f441f201c19008db470687521da4d5d6bfa7c522a4308e5adfe
  tag: v0.1.0-rc.1

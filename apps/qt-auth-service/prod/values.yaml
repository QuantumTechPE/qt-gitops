# GENERADO por el pipeline de CD desde QuantumTechPE/qt-auth-service@483fb18e214574fe32dd41bf2ecf7e552f449508 (prod). No editar a mano:
# lo técnico se cambia en deploy/ del microservicio; la configuración, en qt-config.
containerPort: 8080
probes:
  liveness:
    path: /q/health/live
    initialDelaySeconds: 15
  readiness:
    path: /q/health/no-existe
    initialDelaySeconds: 5
ingress:
  enabled: true
  subdomain: qt
  path: /api/auth
metrics:
  enabled: true
  path: /q/metrics
configFiles:
  mountPath: /deployments/config
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1500m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilizationSeconds: 600
podDisruptionBudget:
  enabled: true
  minAvailable: 1
spreadAcrossNodes: true
image:
  repository: ghcr.io/quantumtechpe/qt-auth-service
  digest: sha256:78d04cff0269bed7170360b250e882185ba466cfa707289841f59bd25c440286
  tag: v0.2.0-rc.3

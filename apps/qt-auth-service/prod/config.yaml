# GENERADO por el CD de qt-config desde QuantumTechPE/qt-config (master:prod/qt-auth-service-prod.yaml). No editar a mano:
# la configuración del ambiente se cambia con un PR en qt-config.
config:
  # Heap de la JVM = 75 % del límite de memoria del pod
  JAVA_MAX_MEM_RATIO: "75"
configFiles:
  files:
    # Sobrescribe src/main/resources/application.properties en el clúster prod.
    # Solo propiedades de RUNTIME (las de build, como quarkus.http.root-path, no aplican).
    application.properties: |
      quarkus.log.level=INFO
      quarkus.log.category."com.qt".level=INFO

      # Ejemplos (descomenta y ajusta):
      # quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-prod:5432/qt
      # quarkus.datasource.jdbc.max-size=20
      # quarkus.rest-client.otro-servicio.url=http://otro-servicio.otro-servicio.svc
secrets:
  enabled: true

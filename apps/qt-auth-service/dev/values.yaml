# GENERADO por el pipeline de CD desde QuantumTechPE/qt-auth-service@5e0018911029063abd992743c7be00338de62ffe (dev). No editar a mano:
# la configuración se cambia en la carpeta deploy/ del repo del microservicio.
containerPort: 8080
probes:
  liveness:
    path: /q/health/live
    initialDelaySeconds: 15
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 5
ingress:
  enabled: true
  subdomain: qt
  path: /api/auth
metrics:
  enabled: true
  path: /q/metrics
configFiles:
  mountPath: /deployments/config
  files:
    application.properties: |
      # =============================================================================
      # DEV · sobrescribe src/main/resources/application.properties en el clúster dev.
      # Se monta como ConfigMap en /deployments/config/application.properties.
      # Solo propiedades de RUNTIME (las de build, como quarkus.http.root-path, no aplican).
      # Secretos: NUNCA aquí → deploy/vault/secrets.yaml
      # =============================================================================
      quarkus.log.level=INFO
      quarkus.log.category."com.qt".level=DEBUG

      # Ejemplos (descomenta y ajusta):
      # quarkus.datasource.jdbc.url=jdbc:postgresql://postgres-dev:5432/qt
      # quarkus.rest-client.otro-servicio.url=http://otro-servicio.otro-servicio.svc
      # quarkus.http.cors.origins=https://qt.dev.miempresa.local
config:
  JAVA_MAX_MEM_RATIO: "75"
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
secrets:
  enabled: true
image:
  repository: ghcr.io/quantumtechpe/qt-auth-service
  digest: sha256:02bdbda35e25d702743e84fb021296dde709f151adf022859218d46008f7a675
  tag: sha-5e00189

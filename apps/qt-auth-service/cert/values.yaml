# GENERADO por el pipeline de CD desde QuantumTechPE/qt-auth-service@2f2406b1226ded5e74d66cc4e9e55cf46f3f0a9b (cert). No editar a mano:
# lo técnico se cambia en deploy/ del microservicio; la configuración, en qt-config.
containerPort: 8080
probes:
  liveness:
    path: /q/health/live
    initialDelaySeconds: 15
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 5
ingress:
  enabled: true
  subdomain: qt
  path: /api/auth
metrics:
  enabled: true
  path: /q/metrics
configFiles:
  mountPath: /deployments/config
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 0
  scaleDownStabilizationSeconds: 300
podDisruptionBudget:
  enabled: false
image:
  repository: ghcr.io/quantumtechpe/qt-auth-service
  digest: sha256:384132b23a4989417772fbdc96629fa62504758dab7bb4bebe9e5e7841168935
  tag: v0.2.0-rc.2

containerPort: 8080
probes:
  liveness:
    path: /q/health/live
    initialDelaySeconds: 15
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 5
ingress:
  enabled: true
  subdomain: qt
  path: /api/auth
metrics:
  enabled: true
  path: /q/metrics
configFiles:
  mountPath: /deployments/config
resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 0
  scaleDownStabilizationSeconds: 300
podDisruptionBudget:
  enabled: false
image:
  repository: ghcr.io/quantumtechpe/qt-auth-service

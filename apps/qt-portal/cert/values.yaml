# GENERADO por el pipeline de CD desde QuantumTechPE/qt-portal@83179ed2ad39bf21cbfc5e6461cf54534c4cf127 (cert). No editar a mano:
# lo técnico se cambia en deploy/ del microservicio; la configuración, en qt-config.
containerPort: 8080
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 2
ingress:
  enabled: true
  subdomain: qt
  path: /
metrics:
  enabled: false
configFiles:
  mountPath: /usr/share/nginx/html/runtime
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 300m
    memory: 96Mi
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
image:
  tag: retiro

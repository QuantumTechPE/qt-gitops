# GENERADO por el pipeline de CD desde QuantumTechPE/qt-portal@83179ed2ad39bf21cbfc5e6461cf54534c4cf127 (prod). No editar a mano:
# lo técnico se cambia en deploy/ del microservicio; la configuración, en qt-config.
containerPort: 8080
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 2
ingress:
  enabled: true
  subdomain: qt
  path: /
metrics:
  enabled: false
configFiles:
  mountPath: /usr/share/nginx/html/runtime
resources:
  requests:
    cpu: 50m
    memory: 48Mi
  limits:
    cpu: 500m
    memory: 128Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0
  scaleDownStabilizationSeconds: 300
podDisruptionBudget:
  enabled: true
  minAvailable: 1
spreadAcrossNodes: true
image:
  repository: ghcr.io/quantumtechpe/qt-portal
  digest: sha256:0e3b83bef9fa97f9d389ba93081a7e7530435516fbe4b2a8156b6f4bc60cd605
  tag: v0.1.0-rc.1

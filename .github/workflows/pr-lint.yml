# Convenciones del PR (en GitOps solo se exige el título convencional).
name: PR Lint

on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-lint:
    name: PR Lint
    uses: QuantumTechPE/qt-infra/.github/workflows/service-pr-lint.yml@master
    with:
      require-issue: false

# Proyecto de Argo CD para microservicios: solo puede desplegar el chart de
# qt-infra con valores de qt-gitops, y no puede crear recursos de clúster
# (salvo su propio Namespace).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
spec:
  description: Microservicios de la organización (prod)
  sourceRepos:
    - https://github.com/QuantumTechPE/qt-infra.git
    - https://github.com/QuantumTechPE/qt-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange

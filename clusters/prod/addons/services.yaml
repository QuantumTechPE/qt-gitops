# Una aplicación de Argo CD por cada carpeta apps/<servicio>/prod de este repo.
# Dar de alta un microservicio = crear esa carpeta (lo hace qt-infra/scripts/new-service.sh).
# apps/<servicio>/prod/values.yaml es un SNAPSHOT completo que escribe el pipeline
# de CD a partir de deploy/ del repo del servicio (recursos, HPA, ConfigMaps, imagen).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/QuantumTechPE/qt-gitops.git
        revision: master
        directories:
          - path: apps/*/prod
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-prod'
      labels:
        qt.platform/service: '{{ index .path.segments 1 }}'
        qt.platform/environment: prod
    spec:
      project: services
      sources:
        - repoURL: https://github.com/QuantumTechPE/qt-infra.git
          targetRevision: master
          path: k8s/charts/qt-service
          helm:
            releaseName: '{{ index .path.segments 1 }}'
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
            # Los fija el clúster (no el servicio): ambiente y dominio del Ingress
            parameters:
              - name: environment
                value: prod
              - name: global.ingressDomain
                value: prod.192.168.18.47.nip.io
        - repoURL: https://github.com/QuantumTechPE/qt-gitops.git
          targetRevision: master
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # ServiceMonitor/ExternalSecret dependen de CRDs de los addons
          - SkipDryRunOnMissingResource=true
        managedNamespaceMetadata:
          labels:
            qt.platform/managed: "true"
            qt.platform/environment: prod
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        retry:
          # Reintentos ilimitados: en un clúster nuevo los webhooks de External Secrets/Kyverno
          # tardan en estar listos; Argo CD no reintenta solo una revisión fallida.
          limit: -1
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m

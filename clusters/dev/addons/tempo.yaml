# Trazas (dev): Grafana Tempo (single binary) con almacenamiento en disco del
# clúster. Recibe OpenTelemetry (OTLP) de los microservicios en
# tempo.monitoring.svc:4317 (gRPC) / :4318 (HTTP). Retención: 72h.
# Grafana lo consulta como datasource "Tempo" (con salto traza ↔ logs de Loki).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Repo comunitario: Grafana deprecó los charts de Tempo de grafana/helm-charts
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 3.2.1
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          reportingEnabled: false
          retention: 72h
          # OpenTelemetry (OTLP) en todas las interfaces del pod
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          # Recursos de este ambiente: ver docs/recursos.md de qt-infra
          resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 512Mi}}
        persistence:
          enabled: true
          size: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

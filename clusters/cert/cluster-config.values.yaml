# Clúster cert: valores del chart qt-infra/k8s/charts/cluster-config.
environment: cert

# Dominio del Ingress: los micros responden en qt.cert.192.168.18.47.nip.io
# y Argo CD en argocd.cert.192.168.18.47.nip.io
ingressDomain: cert.192.168.18.47.nip.io

vault:
  server: https://192.168.18.47:8200
  caBundle: 
  mountPath: k8s-cert

imagePolicy:
  enabled: true
  action: Deny
  imageGlob: ghcr.io/quantumtechpe/*
  subjectRegExp: ^https://github\.com/QuantumTechPE/qt-infra/\.github/workflows/_image\.yml@.+$
